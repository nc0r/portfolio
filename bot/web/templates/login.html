<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ business_name }} Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin.css" rel="stylesheet">
</head>
<body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <section class="card" style="max-width: 420px; width: 100%;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-cut fa-3x text-success mb-3"></i>
                    <h3>{{ business_name }}</h3>
                    <p class="text-muted">Staff scheduling panel</p>
                </div>
                {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
                <form method="post" action="/login">
                    <div class="mb-3">
                        <label for="password" class="form-label">Admin password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter admin password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt me-2"></i>Login</button>
                </form>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
